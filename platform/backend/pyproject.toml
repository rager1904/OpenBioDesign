[project]
name = "openbiodesign-backend"
version = "0.1.0"
description = "Explainable open-source AI-assisted protein binder design platform backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "neo4j>=5.20",
    "torch>=2.0",
    "transformers>=4.35",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=openbiodesign --cov-report=term-missing --cov-fail-under=85"

[tool.setuptools.packages.find]
include = ["openbiodesign*"]
exclude = ["tests*", "migrations*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
